version: "3.9"
services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - BASE_URL=http://localhost:8888/
      - INSTANCE_NAME=FreePerplexity
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: perplexity
      POSTGRES_PASSWORD: perplexity
      POSTGRES_DB: freeplexity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SEARXNG_URL: http://searxng:8080
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://perplexity:perplexity@postgres:5432/freeplexity
    depends_on:
      - searxng
      - redis
      - postgres
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
